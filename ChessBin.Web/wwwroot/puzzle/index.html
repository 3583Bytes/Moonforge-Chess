<!DOCTYPE html>
<html lang="en">

<!--
    Boot page for /puzzle. GitHub Pages serves this as the directory index, which does two
    things the SPA can't: social scrapers get puzzle-specific tags (they never run the
    WebAssembly app, so meta set at runtime is invisible to them), and /puzzle stops
    depending on the 404.html path-restore.

    Shared behaviour lives in js/chessbin.js so this file and index.html can't drift.
    Anything changed in the <head> below should be considered against index.html too.
-->

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="A new chess puzzle every day, the same one for everyone. Solve it in your browser, then see exactly how Moonforge scores the position." />
    <meta name="theme-color" content="#0d0f13" />
    <title>Daily puzzle · ChessBin</title>
    <base href="/" />
    <link rel="preload" id="webassembly" />
    <link rel="stylesheet" href="css/app.css" />
    <link rel="icon" href="favicon.ico" sizes="16x16 32x32 48x48" />
    <link rel="apple-touch-icon" href="brand/apple-touch-icon.png" />
    <link rel="manifest" href="site.webmanifest" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="ChessBin" />
    <meta property="og:title" content="ChessBin · Daily puzzle" />
    <meta property="og:description" content="A new chess puzzle every day, the same one for everyone. Solve it in your browser, then see exactly how Moonforge scores the position." />
    <meta property="og:url" content="https://chessbin.com/puzzle" />
    <meta property="og:image" content="https://chessbin.com/brand/og-puzzle.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="The ChessBin mark above a chessboard, for the daily puzzle." />
    <meta name="twitter:card" content="summary_large_image" />
    <link href="ChessBin.Web.styles.css" rel="stylesheet" />
    <script type="importmap"></script>
</head>

<body>
    <div id="app">
        <svg class="loading-progress">
            <circle r="40%" cx="50%" cy="50%" />
            <circle r="40%" cx="50%" cy="50%" />
        </svg>
        <div class="loading-progress-text"></div>
    </div>

    <div id="blazor-error-ui">
        ChessBin hit an unexpected error.
        <a href="." class="reload">Reload</a>
        <span class="dismiss">🗙</span>
    </div>
    <script src="js/chessbin.js"></script>
    <script src="_framework/blazor.webassembly#[.{fingerprint}].js"></script>
</body>

</html>
